name: Mainline Escalation Probe

# Merge an upstream mainline/stable ref into a Pox branch and probe the build.
# Designed to run the heavy git clone + kernel build in CI (local machine cannot).

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo URL'
        required: true
        default: 'https://github.com/torvalds/linux'
      upstream_ref:
        description: 'Upstream tag/ref to merge (e.g. v4.15)'
        required: true
      align_ref:
        description: 'Previous release tag to align against (e.g. v4.15 when merging v4.16). Empty = use the git merge base.'
        required: false
        default: ''
      base_branch:
        description: 'Branch to start from'
        required: true
        default: 'onyx'
      target_branch:
        description: 'Branch to create/check out'
        required: true
      merge_strategy:
        description: 'git merge -X strategy'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - ours
          - theirs
          - union
      resolve_conflicts:
        description: 'How to resolve conflicts so the build can proceed'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - theirs
          - ours
          - both-ours
          - auto-vendor
          - upstream-core
      attempt_build:
        description: 'Attempt kernel build after the merge'
        required: true
        default: true
        type: boolean
      push_result:
        description: 'Push the resulting branch'
        required: true
        default: false
        type: boolean
      extra_flags:
        description: 'Extra flags handed to make via build.sh EXTRA_FLAGS (e.g. -k to keep going)'
        required: false
        default: ''
        type: string
      self_heal:
        description: 'After a failed build, revert the adopted upstream files that caused the errors and rebuild'
        required: true
        default: false
        type: boolean
      self_heal_iters:
        description: 'Maximum number of revert+rebuild rounds'
        required: false
        default: '3'
        type: string

permissions:
  contents: write

jobs:
  escalate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ${{ inputs.base_branch }} (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch }}

      - name: Configure git identity
        run: |
          git config user.name  "Pox Escalation Bot"
          git config user.email "escalation@pox.local"

      - name: Record base info
        run: |
          {
            echo "### Escalation probe"
            echo ""
            echo "- base branch : ${{ inputs.base_branch }}"
            echo "- base commit : $(git rev-parse --short HEAD)"
            echo "- base version: $(sed -n 's/^VERSION = //p;s/^PATCHLEVEL = //p;s/^SUBLEVEL = //p' Makefile | paste -sd. -)"
            echo "- upstream    : ${{ inputs.upstream_repo }} @ ${{ inputs.upstream_ref }}"
            echo "- target      : ${{ inputs.target_branch }}"
            echo "- strategy    : ${{ inputs.merge_strategy }} / resolve=${{ inputs.resolve_conflicts }}"
            echo ""
          } > report.md

      - name: Add upstream remote and fetch ref
        run: |
          set -euo pipefail
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || git remote set-url upstream "${{ inputs.upstream_repo }}"
          git fetch --no-tags upstream "${{ inputs.upstream_ref }}"
          UP_SHA=$(git rev-parse FETCH_HEAD)
          echo "UPSTREAM_SHA=$UP_SHA" >> $GITHUB_ENV
          echo "upstream sha: $UP_SHA"
          echo "- upstream sha: \`$UP_SHA\`" >> report.md
          # Optional: the PREVIOUS release we are stepping from.  Git's merge base is
          # the point where our vendor fork left mainline (v4.14 for every step), so
          # a file we adopted from v4.15 looks like "we changed it" for the v4.16
          # step and the both-ours policy would freeze it forever.  Aligning against
          # the previous release instead makes each step a true one-release delta.
          if [[ -n "${{ inputs.align_ref }}" ]]; then
            git fetch --no-tags upstream "${{ inputs.align_ref }}"
            ALIGN_SHA=$(git rev-parse FETCH_HEAD)
            echo "ALIGN_SHA=$ALIGN_SHA" >> $GITHUB_ENV
            echo "align sha (${{ inputs.align_ref }}): $ALIGN_SHA"
            echo "- align sha (${{ inputs.align_ref }}): \`$ALIGN_SHA\`" >> report.md
            echo "- commits in this release: $(git rev-list --count "$ALIGN_SHA..$UP_SHA")" >> report.md
          else
            echo "no align_ref given: using the git merge base as the alignment point"
          fi

      - name: Compute merge base and delta size
        run: |
          set +e
          MB=$(git merge-base HEAD "$UPSTREAM_SHA" 2>&1)
          echo "MERGE_BASE=$MB" >> $GITHUB_ENV
          {
            echo "- merge-base: \`$MB\`"
          } >> report.md
          if [[ -n "$MB" ]]; then
            AHEAD=$(git rev-list --count "$MB..HEAD")
            BEHIND=$(git rev-list --count "$MB..$UPSTREAM_SHA")
            echo "- commits vendor-side (ahead): $AHEAD"  >> report.md
            echo "- commits upstream-side (behind): $BEHIND" >> report.md
          fi
          echo "=== merge-base: $MB"
          git --no-pager diff --shortstat "$MB" HEAD || true
          git --no-pager diff --shortstat "$MB" "$UPSTREAM_SHA" || true

      - name: Create branch and merge upstream
        id: merge
        run: |
          set +e
          git checkout -B "${{ inputs.target_branch }}"
          case "${{ inputs.merge_strategy }}" in
            ours)   X="-X ours" ;;
            theirs) X="-X theirs" ;;
            union)  X="-X union" ;;
            *)      X="" ;;
          esac
          git merge --no-commit --no-ff $X "$UPSTREAM_SHA" > merge_out.txt 2>&1
          echo "merge_exit=$?" >> $GITHUB_OUTPUT
          git diff --name-only --diff-filter=U > conflicts.txt
          CONFLICTS=$(wc -l < conflicts.txt | tr -d ' ')
          echo "conflicts=$CONFLICTS" >> $GITHUB_OUTPUT
          echo "=== merge exit / conflicts: $CONFLICTS"

      - name: Summarize conflicts
        run: |
          set +e
          CONFLICTS=$(wc -l < conflicts.txt | tr -d ' ')
          {
            echo ""
            echo "## Merge result"
            echo ""
            echo "- merge exit code: ${{ steps.merge.outputs.merge_exit }}"
            echo "- **conflicted files: $CONFLICTS**"
            echo ""
          } >> report.md
          {
            echo "### merge output (tail)"
            echo '```'
            tail -40 merge_out.txt
            echo '```'
          } >> report.md
          if [[ "$CONFLICTS" -gt 0 ]]; then
            {
              echo ""
              echo "### conflict count by top-level dir"
              echo '```'
              awk -F/ '{if (NF>1) print $1"/"$2; else print $1}' conflicts.txt | sort | uniq -c | sort -rn | head -40
              echo '```'
              echo ""
              echo "### first 100 conflicted files"
              echo '```'
              head -100 conflicts.txt
              echo '```'
            } >> report.md
          fi
          cat report.md

      - name: Resolve conflicts (optional)
        if: inputs.resolve_conflicts != 'none'
        run: |
          set +e
          SIDE="${{ inputs.resolve_conflicts }}"
          UP="$UPSTREAM_SHA"

          # Wholesale per-file selection. Hunk-level -X merging produces MIXED
          # files (a kept vendor hunk referencing a symbol whose definition came
          # from the upstream hunk that was discarded) which cannot compile.
          # Instead: pick one whole version of each conflicted file.
          git merge --abort 2>/dev/null || true
          git merge --no-commit --no-ff "$UP" > merge_out2.txt 2>&1 || true
          git diff --name-only --diff-filter=U > unmerged.txt
          echo "unmerged paths: $(grep -c . unmerged.txt)"

          if [[ "$SIDE" == "both-ours" ]]; then
            # Take OUR version of every file that BOTH sides modified since the
            # merge base -- whether or not git flagged a conflict.
            #
            # Rationale: git's automatic 3-way merge can silently emit a HYBRID
            # for a file it does NOT flag as conflicted.  Observed on v4.15:
            # include/uapi/linux/kcov.h came out with its enumerator block
            # duplicated (KCOV_TRACE_PC/CMP redefined) and scripts/mod/
            # file2alias.c came out with 5 of upstream's new tbsvc tokens but
            # only 1 of the 37 ADD_TO_DEVTABLE() uses.  Both are unbuildable and
            # neither appears in conflicts.txt.  So the conflict list alone is
            # not a sound basis for resolution: the basis is "who touched it".
            #
            # Files only upstream touched keep upstream's content (real forward
            # progress).  Files only we touched keep ours.  Files both touched
            # keep OURS -- these are the coupled pairs, so no half-pair can form
            # and no MediaTek hook is dropped.
            V_REF="${ALIGN_SHA:-$MERGE_BASE}"
            echo "align point: $V_REF (merge base: $MERGE_BASE)"
            git diff --no-renames --name-only -z "$V_REF" HEAD  | tr '\0' '\n' | sort -u > v_changed.txt
            git diff --no-renames --name-only -z "$V_REF" "$UP" | tr '\0' '\n' | sort -u > u_changed.txt
            comm -12 v_changed.txt u_changed.txt > both.txt
            git ls-tree -r -z --name-only HEAD | tr '\0' '\n' | sort -u > head_files.txt
            comm -12 both.txt head_files.txt > keep_ours.txt
            comm -23 both.txt head_files.txt > drop_ours.txt
            echo "vendor-changed=$(grep -c . v_changed.txt) upstream-changed=$(grep -c . u_changed.txt) both=$(grep -c . both.txt)"
            echo "kept-ours=$(grep -c . keep_ours.txt) dropped=$(grep -c . drop_ours.txt)"
            xargs -a keep_ours.txt -d '\n' -r git checkout HEAD --
            xargs -a drop_ours.txt -d '\n' -r git rm -q -f -- 2>/dev/null || true
            # Never let upstream DELETE a file we still ship.  v4.15 moved
            # drivers/base/power/opp/ -> drivers/opp/, so the merge removed the
            # old directory, but our drivers/base/power/Makefile still says
            # "obj-$(CONFIG_PM_OPP) += opp/" and the directory is still needed.
            # The old tree is not built twice, because our drivers/Makefile has
            # no "opp/" entry, so only drivers/base/power/opp/ is compiled.
            git diff --no-renames --name-only -z --diff-filter=D "$V_REF" "$UP" | tr '\0' '\n' | sort -u > u_deleted.txt
            comm -12 u_deleted.txt head_files.txt > keep_deleted.txt
            xargs -a keep_deleted.txt -d '\n' -r git checkout HEAD --
            echo "upstream-deleted=$(grep -c . u_deleted.txt) restored=$(grep -c . keep_deleted.txt)"
            SIDE="both-ours (kept=$(grep -c . keep_ours.txt) dropped=$(grep -c . drop_ours.txt) restored_deleted=$(grep -c . keep_deleted.txt))"
          elif [[ "$SIDE" == "upstream-core" ]]; then
            # Adopt upstream VERBATIM for every path upstream changed since the
            # merge base; keep our own version of everything upstream never
            # touched (the MediaTek/POX-only files). This is the only policy that
            # yields a self-consistent core: no file is left as a 4.14/4.19/5.x
            # hybrid, which is what makes sched.h<->pid.h style breakage impossible.
            git diff --name-only "$MERGE_BASE" "$UP" > up_changed.txt
            echo "paths upstream changed base..target: $(grep -c . up_changed.txt)"
            adopted=0; removed=0
            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              if git cat-file -e "$UP:$f" 2>/dev/null; then
                git checkout "$UP" -- "$f" 2>/dev/null && adopted=$((adopted+1))
              else
                git rm -q -f -- "$f" 2>/dev/null && removed=$((removed+1))
              fi
            done < up_changed.txt
            echo "adopted from upstream: $adopted   removed: $removed"
            SIDE="upstream-core (adopted=$adopted removed=$removed)"
          else
            VENDOR_RE='mediatek|/mtk|mtk_|/mt6[0-9]|mt67|mt68|mtk-|dts/mediatek'
            : > pick_ours.txt ; : > pick_theirs.txt

            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              case "$SIDE" in
                ours)   first=--ours   ;;
                theirs) first=--theirs ;;
                auto-vendor)
                  if echo "$f" | grep -Eq "$VENDOR_RE"; then first=--ours; else first=--theirs; fi
                  ;;
                *)      first=--theirs ;;
              esac
              other=$([[ "$first" == "--ours" ]] && echo --theirs || echo --ours)

              if git checkout "$first" -- "$f" 2>/dev/null; then
                [[ "$first" == "--ours" ]] && echo "$f" >> pick_ours.txt || echo "$f" >> pick_theirs.txt
              elif git checkout "$other" -- "$f" 2>/dev/null; then
                [[ "$other" == "--ours" ]] && echo "$f" >> pick_ours.txt || echo "$f" >> pick_theirs.txt
              else
                git rm -f -- "$f" 2>/dev/null || true
              fi
            done < unmerged.txt

            SIDE="$SIDE (wholesale: ours=$(grep -c . pick_ours.txt), theirs=$(grep -c . pick_theirs.txt))"
          fi
          git add -A
          git -c user.name="Pox Escalation Bot" -c user.email="escalation@pox.local" \
              commit -m "merge(${{ inputs.upstream_ref }}): merge upstream into ${{ inputs.base_branch }} (resolved: $SIDE)" || true

          # Verify marker-free.
          git grep -l '^<<<<<<< ' > markers.txt 2>/dev/null || true
          if [[ -s markers.txt ]]; then
            echo "WARNING: conflict markers present in $(grep -c . markers.txt) files"
          else
            echo "verified: no conflict markers in tree"
          fi
          echo "resolved with: $SIDE" >> report.md

      - name: Apply fixups
        run: |
          set +e
          FIX=""
          for f in ".github/fixups/${{ inputs.target_branch }}.sh" ".github/fixups/fix.sh"; do
            if [[ -f "$f" ]]; then FIX="$f"; break; fi
          done
          if [[ -n "$FIX" ]]; then
            echo "applying $FIX"
            # A CRLF fixup (written from a Windows editor) makes bash die with
            # "$'\r': command not found" and then a syntax error at the first line
            # continuation, so *nothing* after that line gets applied -- observed on
            # the v4.15 step, where the fixup aborted at line 73 and Fixes 2-6 were
            # silently skipped.  Normalise the line endings before handing it to bash.
            sed -i 's/\r$//' "$FIX"
            bash "$FIX" > fixup.log 2>&1
            echo "fixup exit: $?"
            tail -40 fixup.log
            {
              echo ""
              echo "## Fixups ($FIX)"
              echo ""
              echo '```'
              tail -60 fixup.log
              echo '```'
            } >> report.md
            git add -A
            git -c user.name="Pox Escalation Bot" -c user.email="escalation@pox.local" \
                commit -m "fix(${{ inputs.target_branch }}): apply fixups for ${{ inputs.upstream_ref }}" || true
          else
            echo "no fixup script found (looked for .github/fixups/${{ inputs.target_branch }}.sh and .github/fixups/fix.sh)"
          fi

      - name: Publish branch early (so it is visible during the build)
        if: inputs.push_result
        run: |
          git push --force origin "HEAD:refs/heads/${{ inputs.target_branch }}" || echo "early publish failed (harmless)"

      - name: Install host build dependencies
        if: inputs.attempt_build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf libelf-dev libssl-dev lz4 \
            make zip python3 python-is-python3 libncurses5-dev libncurses5

      - name: Cache toolchain (kerdevdep)
        if: inputs.attempt_build
        uses: actions/cache@v4
        with:
          path: |
            kerdevdep/clang
            kerdevdep/gcc
            kerdevdep/anykernel
          key: kerdevdep-toolchains-v2
          restore-keys: |
            kerdevdep-toolchains-v2
            kerdevdep-toolchains-

      - name: Probe build
        id: build
        if: inputs.attempt_build
        run: |
          set +e
          bash kerdevdep/setup_kerdevdep.sh > setup.log 2>&1
          EXTRA_FLAGS="${{ inputs.extra_flags }}" ./build.sh kernel > build_log.txt 2>&1
          RC=$?
          echo "build_rc=$RC" >> $GITHUB_OUTPUT
          ERE='error:|\bError [0-9]+|fatal error|\*\*\*|No such file or directory|undefined reference|not declared'
          ERRORS=$(grep -c -E "$ERE" build_log.txt || true)
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          {
            echo ""
            echo "## Build probe"
            echo ""
            echo "- build exit code: $RC"
            echo "- error-line matches: $ERRORS"
            # How far the build actually got.  A build that dies in prepare0
            # (arch/arm64/kernel/asm-offsets.s, which almost everything else depends
            # on) reports a tiny error count while having compiled almost nothing,
            # and that is very easy to misread as "nearly clean".  Record the depth
            # explicitly so the numbers are always read in context.
            echo "- object compiles seen: $(grep -cE '^  CC ' build_log.txt)"
            echo "- reached the link: $(grep -cE '^  LD +vmlinux' build_log.txt)"
            echo "- image produced: $(grep -c 'Image is ready' build_log.txt)"
            echo ""
            echo "### head of build log (first 40 lines)"
            echo '```'
            head -40 build_log.txt
            echo '```'
            echo ""
            echo "### first 80 error lines"
            echo '```'
            grep -E "$ERE" build_log.txt | head -80
            echo '```'
            echo ""
            echo "### distinct error messages (top 40)"
            echo '```'
            grep -E 'error:' build_log.txt | sed 's/.*error: //' | sort | uniq -c | sort -rn | head -40
            echo '```'
            echo ""
            echo "### tail of build log"
            echo '```'
            tail -40 build_log.txt
            echo '```'
          } >> report.md
          tail -60 build_log.txt

      - name: Self-heal (revert adopted upstream files that break the build)
        if: inputs.attempt_build && inputs.self_heal
        run: |
          set +e
          UP="$UPSTREAM_SHA"
          BASE="origin/${{ inputs.base_branch }}"
          V_REF="${ALIGN_SHA:-$MERGE_BASE}"
          echo "self-heal alignment point: $V_REF"
          git diff --no-renames --name-only "$V_REF" "$BASE" | sort -u > d_ours.txt
          git diff --no-renames --name-only "$V_REF" "$UP"   | sort -u > d_up.txt
          comm -12 d_ours.txt d_up.txt   > d_both.txt
          comm -23 d_ours.txt d_up.txt   > d_oursonly.txt
          comm -23 d_up.txt   d_ours.txt > d_uponly.txt
          : > selfheal_reverts.txt
          echo "self-heal: adopted(upstream-only)=$(grep -c . d_uponly.txt) kept-ours=$(grep -c . d_both.txt)"

          is_upstream() { grep -Fxq "$1" d_uponly.txt; }
          in_ours()     { git cat-file -e "$BASE:$1" 2>/dev/null; }

          for iter in $(seq 1 ${{ inputs.self_heal_iters }}); do
            # Quote style in diagnostics is NOT stable across toolchains: the v4.15
            # logs carried ASCII quotes while the v4.16 log carried the UTF-8
            # typographic U+2018 / U+2019.  Every rule that parses a *quoted
            # identifier* out of a diagnostic (rules 2, 2b, 3a, 3b) therefore matched
            # nothing at all on the v4.16 log -- silently, because a grep that finds
            # nothing looks exactly like a rule that had nothing to find.  That is why
            # the self-heal reported 0 candidates on a tree that was plainly broken.
            # Normalise into log.txt once per round; every rule below uses it.
            sed -e "s/\xe2\x80\x98/'/g" -e "s/\xe2\x80\x99/'/g" \
                -e "s/\xe2\x80\x9c/\"/g" -e "s/\xe2\x80\x9d/\"/g" \
                build_log.txt > log.txt 2>/dev/null || cp build_log.txt log.txt

            # Linker failures contain no " error: " at all -- ld says
            # "undefined reference to `sym'".  Counting compiler errors alone made
            # a build with 109 unresolved symbols look "already clean" (observed on
            # the v4.15 step, run 39247895793), so every shape of build failure is
            # counted here.
            NERR=$(grep -cE ' error: |undefined reference to |multiple definition of |cannot find -l|No rule to make target' log.txt)
            echo ""
            echo "===== self-heal round $iter (build has $NERR error lines) ====="
            if [ "$NERR" -eq 0 ]; then echo "build already clean"; break; fi

            : > cand.txt

            # (0) The most reliable signal of all: the file clang itself names in
            #     a `note:` that explains an error --
            #       "note: previous definition is here"   (redefinition)
            #       "note: 'x' declared here" / "defined here" (signature clash)
            #       "note: expanded from macro 'x'"  (macro from a changed header)
            #     That is the culprit definition, and it is what hand analysis of
            #     the NFS/refcount and XFS clusters found (F-024).  If the note
            #     names OUR file the revert is a no-op, so this is safe.
            grep -E ': note: ' log.txt \
              | grep -E 'here|previous (implicit )?declaration|previous definition|defined here|expanded from macro' \
              | sed -E 's#^.*/pox-kernel-begonia/##' \
              | sed -E 's#^([^:]+):[0-9]+(:[0-9]+)?: note: .*#\1#' \
              | sort -u > notefiles.txt
            while read -r f; do
              [ -n "$f" ] || continue
              if is_upstream "$f" && in_ours "$f"; then echo "$f" >> cand.txt; fi
            done < notefiles.txt

            # (1) files that themselves failed to compile and were adopted from upstream
            grep -E ' error: ' log.txt \
              | sed -E 's#^.*/pox-kernel-begonia/##' \
              | sed -E 's#^([^:]+):[0-9]+(:[0-9]+)?: error: .*#\1#' \
              | sort -u > errfiles.txt
            while read -r f; do
              [ -n "$f" ] || continue
              if is_upstream "$f" && in_ours "$f"; then echo "$f" >> cand.txt; fi
            done < errfiles.txt

            # (2) upstream HEADERS that DEFINE a symbol some file could not find.
            #     Restricted to headers and to definition-shaped lines: a bare
            #     `git grep -w <sym>` on a generic word such as "block" or "flags"
            #     matches hundreds of unrelated files and would revert far too much.
            { sed -n "s/.*use of undeclared identifier '\([A-Za-z_][A-Za-z0-9_]*\)'.*/\1/p" log.txt
              sed -n "s/.*implicit declaration of function '\([A-Za-z_][A-Za-z0-9_]*\)'.*/\1/p" log.txt
              sed -n "s/.*unknown type name '\([A-Za-z_][A-Za-z0-9_]*\)'.*/\1/p" log.txt
            } | sort -u > syms.txt
            while read -r s; do
              [ -n "$s" ] || continue
              case "$s" in
                block|flags|dev|info|data|name|list|node|type|size|count|index|value|mode|addr|len|ops|queue|req|bio|inode|file|page|task|work|event|state|config|owner|private|key|id) continue ;;
              esac
              for df in $(git grep -l -E "(^|[^A-Za-z0-9_])$s[[:space:]]*;" "$UP" -- '*.h' 2>/dev/null | sed -E 's#^[^:]+:##' | head -8) \
                        $(git grep -l -E "^#define[[:space:]]+$s([^A-Za-z0-9_]|$)" "$UP" -- '*.h' 2>/dev/null | sed -E 's#^[^:]+:##' | head -8) \
                        $(git grep -l -E "typedef[^;]*[^A-Za-z0-9_]$s[[:space:]]*;" "$UP" -- '*.h' 2>/dev/null | sed -E 's#^[^:]+:##' | head -8) \
                        $(git grep -l -E "(^|[^A-Za-z0-9_])$s[[:space:]]*\(" "$UP" -- '*.h' 2>/dev/null | sed -E 's#^[^:]+:##' | head -8); do
                if is_upstream "$df" && in_ours "$df"; then echo "$df" >> cand.txt; fi
              done
            done < syms.txt

            # (2b) The same symbols, looked up in OUR OWN tree instead.  If our tree
            #      defined the symbol but the merged tree does not, then the file that
            #      defined it was replaced by an adopted version -- and upstream may
            #      not have the symbol at all any more (arm64 local_dbg_save,
            #      netfilter LOG_INVALID, ...), in which case rule 2 finds nothing.
            #      Searching our side finds the file that has to come back.
            while read -r s; do
              [ -n "$s" ] || continue
              case "$s" in
                block|flags|dev|info|data|name|list|node|type|size|count|index|value|mode|addr|len|ops|queue|req|bio|inode|file|page|task|work|event|state|config|owner|private|key|id) continue ;;
              esac
              for df in $(git grep -l -w "$s" "$BASE" -- '*.h' 2>/dev/null | sed -E 's#^[^:]+:##' | head -8); do
                if is_upstream "$df" && in_ours "$df"; then echo "$df" >> cand.txt; fi
              done
            done < syms.txt

            # (3a) the file that DEFINES the struct whose member has gone away
            sed -n "s/.*no member named '[A-Za-z_][A-Za-z0-9_]*' in 'struct \([A-Za-z_][A-Za-z0-9_]*\)'.*/\1/p" log.txt | sort -u > structs.txt
            while read -r t; do
              [ -n "$t" ] || continue
              for df in $(git grep -l -F "struct $t {" HEAD 2>/dev/null | sed -E 's#^[^:]+:##' | head -8) \
                        $(git grep -l -F "} $t;" HEAD 2>/dev/null | sed -E 's#^[^:]+:##' | head -8); do
                if is_upstream "$df" && in_ours "$df"; then echo "$df" >> cand.txt; fi
              done
            done < structs.txt

            # (4) errors in a file that does not exist in our tree at all, i.e. one
            #     upstream ADDED (xfs_iext_tree.c in v4.15).  There is nothing to
            #     revert it TO, so stop building it: revert the adopted Makefile that
            #     references its object.  Only ever triggered for a file we do not
            #     have, so no file of ours can be dropped from the build by this.
            while read -r f; do
              [ -n "$f" ] || continue
              if is_upstream "$f" && ! in_ours "$f"; then
                o="$(basename "$f")"
                o="${o%.c}.o"
                for mk in $(git grep -l -F "$o" HEAD -- 'Makefile' 'Kbuild' '*/Makefile' '*/Kbuild' 2>/dev/null | sed -E 's#^[^:]+:##' | head -6); do
                  if is_upstream "$mk" && in_ours "$mk"; then echo "$mk" >> cand.txt; fi
                done
              fi
            done < errfiles.txt

            # (5) undefined REFERENCES at link time.  ` error: ` never sees these.
            #     Two sub-cases, both of them "restore a file we already ship":
            #     (5a) the file making the reference is adopted, and OUR version of
            #          that file does not reference the symbol at all -- so
            #          reverting it only removes a call our generation never made.
            #          (upstream's mm/sparse-vmemmap.c calling
            #          memblock_virt_alloc_try_nid_raw; upstream's
            #          arch/arm64/lib/delay.c calling arch_timer_evtstrm_available,
            #          which upstream defines in the timer driver we keep ours.)
            #     (5b) the file that DEFINED the symbol in our tree was replaced by
            #          an upstream version that no longer defines it
            #          (fs/xfs/libxfs/xfs_bmap_btree.c for the xfs_bmbt_* extent
            #          accessors; fs/xfs/xfs_buf.h, which our tree defines
            #          xfs_buf_set_ref as a static inline in while upstream moved it
            #          into upstream's xfs_buf.c, a file we keep ours).
            grep -o "undefined reference to \`[A-Za-z_][A-Za-z0-9_]*'" log.txt \
              | sed -E "s/.*\`([A-Za-z_][A-Za-z0-9_]*)'.*/\1/" | sort -u > linksyms.txt
            grep -E "^[^ ]+\.o[:(]" log.txt \
              | sed -E 's#^.*/pox-kernel-begonia/##' \
              | sed -E 's#^([^:]+)\.o[:(].*#\1.c#' | sort -u > linkobjs.txt
            while read -r f; do
              [ -n "$f" ] || continue
              if is_upstream "$f" && in_ours "$f"; then
                hit=0
                while read -r s; do
                  [ -n "$s" ] || continue
                  if git grep -q -w "$s" "$BASE" -- "$f" 2>/dev/null; then hit=1; fi
                done < linksyms.txt
                if [ "$hit" -eq 0 ]; then
                  echo "  (5a) $f references none of them in our tree"
                  echo "$f" >> cand.txt
                fi
              fi
            done < linkobjs.txt
            while read -r s; do
              [ -n "$s" ] || continue
              case "$s" in
                block|flags|dev|info|data|name|list|node|type|size|count|index|value|mode|addr|len|ops|queue|req|bio|inode|file|page|task|work|event|state|config|owner|private|key|id) continue ;;
              esac
              for df in $(git grep -l -E "(^|[^A-Za-z0-9_])$s[[:space:]]*\(" "$BASE" -- '*.c' 2>/dev/null | sed -E 's#^[^:]+:##' | head -8) \
                        $(git grep -l -E "(^|[^A-Za-z0-9_])$s[[:space:]]*\(" "$BASE" -- '*.h' 2>/dev/null | sed -E 's#^[^:]+:##' | head -8); do
                if is_upstream "$df" && in_ours "$df"; then
                  echo "  (5b) $df defines $s in our tree"
                  echo "$df" >> cand.txt
                fi
              done
            done < linksyms.txt

            # (6) scripts/kconfig is a small self-contained HOST program (the .config
            #     parser) that is rebuilt for every build, and mixing generations inside
            #     it is fatal: v4.16 kept upstream's lkc.h/lkc_proto.h/util.c/conf.c
            #     beside our symbol.c/menu.c, so the tree could not even run
            #     `make defconfig` -- it died in the kconfig host build before compiling
            #     a single kernel object.  Nothing in the kernel and nothing in any
            #     driver depends on which generation of these files builds the parser,
            #     so when the failure is inside scripts/kconfig, hold the WHOLE
            #     directory at our generation.  (Rules 0 and 3b find the single culprit;
            #     this closes the rest of the subsystem in the same pass, so the tool is
            #     never left half-upgraded and never needs a second round.)
            if grep -q '^scripts/kconfig/' errfiles.txt || grep -q '^scripts/kconfig/' notefiles.txt; then
              echo "  (6) failure inside scripts/kconfig: holding the host tool at our generation"
              for df in $(git diff --no-renames --name-only "$V_REF" "$UP" -- scripts/kconfig | sort -u); do
                if is_upstream "$df" && in_ours "$df"; then echo "    hold $df"; echo "$df" >> cand.txt; fi
              done
            fi

            # (3b) the other definition of a redefined identifier, and the adopted
            #      header that declares a function with a conflicting signature
            { sed -n "s/.*redefinition of '\([A-Za-z_][A-Za-z0-9_]*\)'.*/\1/p" log.txt
              sed -n "s/.*conflicting types for '\([A-Za-z_][A-Za-z0-9_]*\)'.*/\1/p" log.txt
            } | sort -u > idents.txt
            while read -r t; do
              [ -n "$t" ] || continue
              for df in $(git grep -l -w "$t" HEAD 2>/dev/null | sed -E 's#^[^:]+:##' | head -8); do
                if is_upstream "$df" && in_ours "$df"; then echo "$df" >> cand.txt; fi
              done
            done < idents.txt

            sort -u cand.txt > cand2.txt
            N=$(grep -c . cand2.txt)
            echo "round $iter: $N adopted upstream files are implicated; reverting them to ours"
            if [ "$N" -eq 0 ]; then echo "nothing left to revert mechanically; stopping"; break; fi
            head -50 cand2.txt | sed 's/^/    revert /'
            while read -r f; do
              git checkout "$BASE" -- "$f" 2>/dev/null && echo "$f" >> selfheal_reverts.txt
            done < cand2.txt
            git add -A
            git -c user.name="Pox Escalation Bot" -c user.email="escalation@pox.local" \
                commit -m "selfheal(${{ inputs.target_branch }}): revert $N adopted upstream files that break the build (round $iter)" || true
            EXTRA_FLAGS="${{ inputs.extra_flags }}" ./build.sh kernel > build_log.txt 2>&1
            echo "round $iter rebuild exit: $?  error lines: $(grep -c ' error: ' build_log.txt)  unresolved symbols: $(grep -c 'undefined reference to' build_log.txt)"
          done

          {
            echo ""
            echo "## Self-heal"
            echo ""
            echo "- adopted upstream files reverted: $(grep -c . selfheal_reverts.txt)"
            echo "- final error lines: $(grep -c ' error: ' build_log.txt)"
            echo "- final unresolved symbols: $(grep -c 'undefined reference to' build_log.txt)"
            echo "- final object compiles seen: $(grep -cE '^  CC ' build_log.txt)"
            echo "- final reached the link: $(grep -cE '^  LD +vmlinux' build_log.txt)"
            echo "- final image produced: $(grep -c 'Image is ready' build_log.txt)"
            echo ""
            echo '```'
            sort -u selfheal_reverts.txt | head -120
            echo '```'
          } >> report.md

      - name: Diagnose error provenance
        if: inputs.attempt_build
        run: |
          set +e
          [ -f build_log.txt ] || exit 0
          # Same quote normalisation as the self-heal: without it every
          # quoted-identifier table in this report comes out empty.
          sed -e "s/\xe2\x80\x98/'/g" -e "s/\xe2\x80\x99/'/g" build_log.txt > log.txt 2>/dev/null || cp build_log.txt log.txt
          UP="$UPSTREAM_SHA"
          # Change sets: who touched what, relative to the merge base.
          git diff --no-renames --name-only "$MERGE_BASE" "origin/${{ inputs.base_branch }}" | sort -u > d_ours.txt
          git diff --no-renames --name-only "$MERGE_BASE" "$UP" | sort -u > d_up.txt
          comm -12 d_ours.txt d_up.txt   > d_both.txt
          comm -23 d_up.txt   d_ours.txt > d_uponly.txt
          comm -23 d_ours.txt d_up.txt   > d_oursonly.txt
          { awk '{print $0"\tOURS"}'      d_both.txt
            awk '{print $0"\tUPSTREAM"}'  d_uponly.txt
            awk '{print $0"\tOURS-ONLY"}' d_oursonly.txt
          } | sort -u > d_map.txt
          side_of() { s=$(awk -v f="$1" '$1==f{print $2; exit}' d_map.txt); [ -n "$s" ] && echo "$s" || echo SAME; }

          # file<TAB>message for every compiler error
          grep -E ' error: ' log.txt \
            | sed -E 's#^.*/pox-kernel-begonia/##' \
            | sed -E 's#^([^:]+:[0-9]+:[0-9]+): error: #\1\t#' \
            | grep -P '\t' > errs.txt
          awk -F'\t' '{c[$1"\x01"$2]++} END{for(k in c) print c[k]"\t"k}' errs.txt | sort -rn > errgroups.txt

          {
            echo ""
            echo "## Error provenance diagnosis"
            echo ""
            echo "- paths we changed since merge base:  $(grep -c . d_ours.txt)"
            echo "- paths upstream changed:             $(grep -c . d_up.txt)"
            echo "- paths BOTH changed (kept ours):     $(grep -c . d_both.txt)"
            echo "- paths only upstream changed (adopted): $(grep -c . d_uponly.txt)"
            echo "- paths only we changed:              $(grep -c . d_oursonly.txt)"
            echo ""
            echo "### top 60 error groups with the SIDE of the file that fails"
            echo ""
            echo "| count | side | file | message |"
            echo "| --- | --- | --- | --- |"
            head -60 errgroups.txt | while IFS=$'\t' read -r n key; do
              f="${key%%$'\x01'*}"; m="${key#*$'\x01'}"
              printf '| %s | %s | `%s` | %s |\n' "$n" "$(side_of "$f")" "$f" "$(echo "$m" | cut -c1-110)"
            done
            echo ""
            echo "### totals by side"
            echo ""
            echo '```'
            head -400 errgroups.txt | while IFS=$'\t' read -r n key; do
              f="${key%%$'\x01'*}"; echo "$n $(side_of "$f")"
            done | awk '{t[$2]+=$1} END{for(s in t) printf "%-12s %d error lines\n", s, t[s]}' | sort -k2 -rn
            echo '```'
            echo ""
            echo "### symbols used but not declared -> where upstream v4.15 defines them"
            echo ""
            echo '```'
            { sed -n "s/.*use of undeclared identifier '\([A-Za-z_][A-Za-z0-9_]*\)'.*/\1/p" log.txt
              sed -n "s/.*implicit declaration of function '\([A-Za-z_][A-Za-z0-9_]*\)'.*/\1/p" log.txt
              sed -n "s/.*unknown type name '\([A-Za-z_][A-Za-z0-9_]*\)'.*/\1/p" log.txt
            } | sort | uniq -c | sort -rn | head -45 | while read -r cnt sym; do
              defs=""
              for df in $(git grep -l -w "$sym" "$UP" -- 'include' 'block' 'arch/arm64' 'kernel' 2>/dev/null | head -3); do
                defs="$defs $df[$(side_of "$df")]"
              done
              printf '%-6s %-34s <=%s\n' "$cnt" "$sym" "$defs"
            done
            echo '```'
            echo ""
            echo "### no-member errors -> where upstream v4.15 has that member"
            echo ""
            echo '```'
            sed -n "s/.*no member named '\([A-Za-z_][A-Za-z0-9_]*\)' in '\(struct [A-Za-z_][A-Za-z0-9_]*\)'.*/\2 :: \1/p" log.txt \
              | sort | uniq -c | sort -rn | head -30 | while read -r cnt rest; do
                st="${rest%% :: *}"; mem="${rest#* :: }"; stn="${st##struct }"
                f=$(git grep -l -w "struct $stn {" "$UP" -- 'include' 2>/dev/null | head -1)
                printf '%-6s %-28s member %-26s struct-defined-in=%s[%s]\n' "$cnt" "$stn" "$mem" "$f" "$(side_of "$f")"
              done
            echo '```'
          } | tee -a report.md > diagnosis.txt

      - name: Push resulting branch
        if: inputs.push_result
        run: |
          git push --force origin "${{ inputs.target_branch }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escalation-${{ inputs.target_branch }}-${{ inputs.upstream_ref }}
          path: |
            report.md
            conflicts.txt
            merge_out.txt
            merge_out2.txt
            unmerged.txt
            pick_ours.txt
            pick_theirs.txt
            log.txt
            fixup.log
            diagnosis.txt
            d_both.txt
            d_uponly.txt
            d_oursonly.txt
            selfheal_reverts.txt
          retention-days: 30

      - name: Job summary
        if: always()
        run: cat report.md >> $GITHUB_STEP_SUMMARY




